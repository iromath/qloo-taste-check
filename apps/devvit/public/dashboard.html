<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Taste Check — Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> Taste Check</div>
    <span class="pill" id="status">loading</span>
  </div>

  <p class="kicker">Moderator view</p>
  <h1>How the community reads the graph</h1>
  <p class="sub" id="sub">Aggregate accuracy and the cards that keep fooling everyone.</p>

  <div id="view" class="hidden">
    <div class="kpis">
      <div class="kpi"><b id="k-rounds">0</b><span>rounds</span></div>
      <div class="kpi"><b id="k-votes">0</b><span>votes</span></div>
      <div class="kpi"><b id="k-acc">0%</b><span>accuracy</span></div>
      <div class="kpi"><b id="k-players">0</b><span>players</span></div>
    </div>

    <div class="section">
      <h2>Verdict mix</h2>
      <div class="mix" id="mix"></div>
    </div>

    <div class="section">
      <h2>Hardest cards</h2>
      <div class="board" id="hardest"></div>
    </div>

    <div class="section">
      <h2>Top players</h2>
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="err hidden" id="err"></div>
  <p class="note">Stats are per-installation and live in Devvit Redis. No per-user data leaves the app.</p>
</div>

<script src="dashboard.js"></script>
</body>
</html>
